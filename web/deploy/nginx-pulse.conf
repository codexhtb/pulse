server {
    listen 192.0.2.10:80 default_server;
    listen 127.0.0.1:80;
    server_name pulse.example.net 192.0.2.10;
    access_log /var/log/nginx/pulse-access.log pulse_no_query;

    if ($pulse_web_allowed = 0) { return 403; }
    return 301 https://$host$uri$is_args$args;
}

server {
    listen 192.0.2.10:443 ssl default_server;
    listen 127.0.0.1:443 ssl;
    server_name pulse.example.net 192.0.2.10;

    ssl_certificate /etc/pulse/tls/pulse.crt;
    ssl_certificate_key /etc/pulse/tls/pulse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/pulse-access.log pulse_no_query;
    error_log /var/log/nginx/pulse-error.log;

    if ($pulse_web_allowed = 0) { return 403; }

    root /var/www/pulse;
    index index.html;

    include /etc/nginx/snippets/pulse-security-headers.conf;

    location = /api/v1/live {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
        include /etc/nginx/snippets/pulse-security-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pulse-security-headers.conf;
    }

    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/pulse-security-headers.conf;
    }
}
